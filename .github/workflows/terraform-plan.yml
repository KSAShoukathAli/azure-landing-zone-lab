name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/envs/lab/**'
      - 'terraform/envs/governance/**'
      - 'terraform/modules/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [lab, governance]
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.root }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          case $code in
            0) result="No changes" ;;
            2) result="Changes detected" ;;
            *) result="Plan failed" ;;
          esac
          {
            echo "### ${{ matrix.root }}: $result"
            echo '```'
            grep -E '^(Plan:|No changes|Error|  #)' plan.txt || tail -n 30 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -eq 1 ]; then exit 1; fi