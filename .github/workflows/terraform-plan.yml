name: terraform-plan

on:
  # No paths filter: the branch ruleset requires these checks on every PR,
  # so they must run on every PR (docs PRs just show No changes).
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [lab, governance]
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.root }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # Readable copy of the saved plan, uploaded below for review.
          if [ $code -ne 1 ]; then terraform show -no-color tfplan > plan-readable.txt; fi
          case $code in
            0) result="No changes" ;;
            2) result="Changes detected" ;;
            *) result="Plan failed" ;;
          esac
          {
            echo "### ${{ matrix.root }}: $result"
            echo '```'
            grep -E '^(Plan:|No changes|Error|  #)' plan.txt || tail -n 30 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -eq 1 ]; then exit 1; fi

      # Stored plan for review: run page > Summary > Artifacts.
      # Text only. The binary plan is not uploaded from PRs; apply uses a fresh plan on main.
      - name: upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.root }}-pr${{ github.event.pull_request.number }}
          path: |
            terraform/envs/${{ matrix.root }}/plan.txt
            terraform/envs/${{ matrix.root }}/plan-readable.txt
          retention-days: 7
          if-no-files-found: warn
